name: build

# Builds the patched programs from a clean checkout of the tag in upstream.txt and the patches in
# patches/: the launcher (offline play, Ely.by accounts) and the game client (skins). A tag
# `ely-v*` publishes the archives as a GitHub release; anything else only builds and keeps them
# as run artifacts.
on:
  push:
    branches: [main]
    tags: ['ely-v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  launcher:
    name: launcher ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
            rustflags: ''
          - name: windows
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .work/upstream/launcher

      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev

      - name: The upstream tag and the patches
        shell: bash
        run: |
          set -euo pipefail
          # Git for Windows would check the patch (and the upstream clone) out with CRLF, which
          # `git apply` reads as trailing whitespace and refuses.
          git config --global core.autocrlf false
          read -r ref sha < <(grep -v '^[[:space:]]*#' upstream.txt | grep -v '^[[:space:]]*$' | head -1)
          version=$(grep -v '^[[:space:]]*#' version.txt | grep -v '^[[:space:]]*$' | head -1)
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          # rust-cache restores the target folder, and with it the folders above it.
          rm -rf .work/upstream
          git clone --depth 1 --branch "$ref" https://github.com/horizon-rust/horizon.git .work/upstream
          cd .work/upstream
          test "$(git rev-parse HEAD)" = "$sha" || {
            echo "::error::upstream.txt pins $sha, $ref is $(git rev-parse HEAD)"
            exit 1
          }
          for patch in ../../patches/*.patch; do
            echo "applying $(basename "$patch")"
            git apply --ignore-whitespace "$patch"
          done

      - name: Test and build
        shell: bash
        working-directory: .work/upstream/launcher
        run: |
          set -euo pipefail
          cargo test --release --locked
          cargo build --release --locked
          ./target/release/${{ matrix.binary }} --version | tee version.txt
          grep -qx "horizon-launcher $HORIZON_LAUNCHER_VERSION" version.txt || {
            echo "::error::expected horizon-launcher $HORIZON_LAUNCHER_VERSION"
            exit 1
          }

      - name: Package
        shell: bash
        working-directory: .work/upstream/launcher
        run: |
          set -euo pipefail
          mkdir -p ../../../dist
          cp "target/release/${{ matrix.binary }}" ../../../dist/
          cd ../../../dist
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.binary }}" ;;
            *.zip) 7z a "${{ matrix.asset }}" "${{ matrix.binary }}" >/dev/null ;;
          esac
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 14

  game:
    name: game ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-client-linux-x86_64.tar.gz
            binary: horizon-client
            rustflags: ''
          - name: windows
            os: windows-latest
            asset: horizon-client-windows-x64.zip
            binary: horizon-client.exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .work/upstream

      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - name: The upstream tag and the patches
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          read -r ref sha < <(grep -v '^[[:space:]]*#' upstream.txt | grep -v '^[[:space:]]*$' | head -1)
          version=$(grep -v '^[[:space:]]*#' game-version.txt | grep -v '^[[:space:]]*$' | head -1)
          echo "HORIZON_VERSION=$version" >> "$GITHUB_ENV"
          rm -rf .work/upstream
          git clone --depth 1 --branch "$ref" https://github.com/horizon-rust/horizon.git .work/upstream
          cd .work/upstream
          test "$(git rev-parse HEAD)" = "$sha" || {
            echo "::error::upstream.txt pins $sha, $ref is $(git rev-parse HEAD)"
            exit 1
          }
          for patch in ../../patches/*.patch; do
            echo "applying $(basename "$patch")"
            git apply --ignore-whitespace "$patch"
          done

      - name: Test the skin changes and build the client
        shell: bash
        working-directory: .work/upstream
        run: |
          set -euo pipefail
          cargo test --release --locked -p horizon-client --lib skins::
          cargo build --release --locked --features horizon-client/mods \
            -p horizon-client --bin horizon-client

      - name: Package
        shell: bash
        working-directory: .work/upstream
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          cp "target/release/${{ matrix.binary }}" ../../dist/
          cd ../../dist
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.binary }}" ;;
            *.zip) 7z a "${{ matrix.asset }}" "${{ matrix.binary }}" >/dev/null ;;
          esac
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/ely-v')
    needs: [launcher, game]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Patched Horizon launcher and game client (${{ github.sha }}).
          Install with scripts/install.sh --download, or --replace PATH for a launcher you already run; the game client goes into the installed version's folder. The launcher keeps its data folder and never updates itself."
